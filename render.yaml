services:
  - type: worker
    name: userbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python userbot.py
    envVars:
      - key: API_ID
        value: your_api_id
      - key: API_HASH
        value: your_api_hash
      - key: SESSION_STRING
        value: your_session_string
